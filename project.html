<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أعمالنا — Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;600;800;900&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=Almarai:wght@300;400;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
.pvideo{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.pvideo iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line)}
.facts div{background:var(--bg);padding:24px 22px}
.facts dt{font-size:11px;letter-spacing:.18em;color:var(--accent);margin-bottom:8px}
.facts dd{font-size:15.5px}
/* الفيديو الرأسي (ريلز) يتوسّط بعرض يناسب الشاشة */
.pvideo.tall{width:min(100%,calc(82svh * var(--r)));margin-inline:auto}
.nextp{border-top:1px solid var(--line);padding-block:var(--sec)}
.nextp a{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.nextp .t{font-family:var(--en);font-weight:900;font-size:clamp(1.8rem,5vw,3.6rem);text-transform:uppercase;
  letter-spacing:-.03em;transition:color .35s}
html[lang="ar"] .nextp .t{font-family:var(--ar);font-weight:700;text-transform:none}
.nextp a:hover .t{color:var(--accent2)}
</style>
</head>
<body data-page="portfolio.html">
<div id="slot-header"></div>

<section style="padding-top:clamp(92px,11vw,120px)">
  <div class="pvideo" id="pv"></div>
</section>

<section style="padding-block:var(--sec)"><div class="wrap">
  <div class="crumbs rev"><a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a><span>/</span>
    <a href="portfolio.html" data-ar="الأعمال" data-en="Work">الأعمال</a><span>/</span>
    <em style="font-style:normal" id="pcrumb"></em></div>
  <h1 class="display h1 rev" id="ptitle"></h1>
  <p class="lead rev" id="psum" style="margin-top:20px;max-width:62ch"></p>
</div></section>

<section style="padding-bottom:var(--sec)"><div class="wrap">
  <dl class="facts rev" id="pfacts"></dl>
</div></section>

<!-- أعمال قريبة -->
<section class="sec" style="padding-top:0"><div class="wrap">
  <h2 class="display h2 rev" style="margin-bottom:clamp(28px,4vw,44px)" data-ar="أعمال قريبة" data-en="Related work">أعمال قريبة</h2>
  <div class="mosaic" id="related"></div>
</div></section>

<!-- المشروع التالي -->
<section class="nextp"><div class="wrap">
  <a href="project.html" class="rev" id="pnext">
    <div>
      <p class="muted" style="margin-bottom:10px" data-ar="المشروع التالي" data-en="Next project">المشروع التالي</p>
      <span class="t" id="pnextT"></span>
    </div>
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.4"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </a>
</div></section>

<div id="slot-footer"></div>

<script src="assets/site.js"></script>
<script>
/* صفحة عمل واحدة لكل المشاريع: project.html?w=<slug> */
document.addEventListener('DOMContentLoaded',()=>{
  const slug=new URLSearchParams(location.search).get('w');
  const i=Math.max(0,PROJECTS.findIndex(p=>p.slug===slug)), p=PROJECTS[i];
  const t=(el,ar,en)=>{el.dataset.ar=ar; el.dataset.en=en||ar; el.textContent=ar;};

  const [w,h]=p.r.split('/').map(Number);
  const pv=document.getElementById('pv');
  pv.style.aspectRatio=p.r; pv.style.setProperty('--r',w/h); pv.classList.toggle('tall',h>w);
  pv.innerHTML=`<iframe src="https://player.vimeo.com/video/${p.vid}?dnt=1&title=0&byline=0&portrait=0"
    allow="fullscreen;picture-in-picture" allowfullscreen title="${p.en}"></iframe>`;

  document.title=`${p.ar} — Blue`;
  t(document.getElementById('pcrumb'),p.ar,p.en);
  t(document.getElementById('ptitle'),p.ar,p.en);
  const sum=document.getElementById('psum');
  if(p.sar) t(sum,p.sar,p.sen); else sum.remove();

  const mm=`${Math.floor(p.d/60)}:${String(p.d%60).padStart(2,'0')}`;
  const facts=[
    p.cl_ar && ['العميل','CLIENT',`<dd data-ar="${p.cl_ar}" data-en="${p.cl_en}">${p.cl_ar}</dd>`],
    ['السنة','YEAR',`<dd><bdi dir="ltr">${p.y}</bdi></dd>`],
    ['التصنيف','CATEGORY',`<dd data-ar="${p.car}" data-en="${p.cen}">${p.car}</dd>`],
    ['المدة','DURATION',`<dd><bdi dir="ltr">${mm}</bdi></dd>`]
  ].filter(Boolean);
  document.getElementById('pfacts').innerHTML=facts.map(([ar,en,dd])=>
    `<div><dt data-ar="${ar}" data-en="${en}">${ar}</dt>${dd}</div>`).join('');

  const others=PROJECTS.filter(q=>q!==p);
  const rel=[...others.filter(q=>q.k===p.k),...others.filter(q=>q.k!==p.k)].slice(0,3);
  document.getElementById('related').innerHTML=rel.map(q=>tile(q,'s-md')).join('');

  const n=PROJECTS[(i+1)%PROJECTS.length];
  document.getElementById('pnext').href=`project.html?w=${n.slug}`;
  t(document.getElementById('pnextT'),n.ar,n.en);
});
</script>
</body>
</html>
